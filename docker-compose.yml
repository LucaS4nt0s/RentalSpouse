services:
  db:
    image: postgres:15
    container_name: rentalspouse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentalspouse_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Configuração do e-mail transacional (verificação de conta).
      # Padrão `console`: o e-mail é escrito no log, sem exigir SMTP configurado.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-RentalSpouse}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-nao-responda@rentalspouse.local}
      EMAIL_VERIFICACAO_EXPIRA_HORAS: ${EMAIL_VERIFICACAO_EXPIRA_HORAS:-24}
      EMAIL_VERIFICACAO_REENVIO_SEGUNDOS: ${EMAIL_VERIFICACAO_REENVIO_SEGUNDOS:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      SEED_INITIAL_ADMIN: ${SEED_INITIAL_ADMIN:-true}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Administrador Inicial}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@rentalspouse.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin@123456}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: rentalspouse_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./web:/app/web
      - ./packages:/app/packages
      - /app/web/node_modules
      - /app/web/.next

  # ---------------------------------------------------------------------------
  # Mailpit — capturador de e-mails para DESENVOLVIMENTO (opcional).
  #
  # Justificativa arquitetural (AI_RULES.md § 1): a verificação de e-mail exige
  # um SMTP para ser testada de ponta a ponta. O Mailpit oferece esse SMTP local
  # sem depender de credenciais reais nem enviar mensagens para terceiros, e a
  # caixa de entrada fica visível em http://localhost:8025.
  #
  # Para usá-lo, defina no `.env`:
  #   EMAIL_BACKEND=smtp
  #   SMTP_HOST=mailpit
  #   SMTP_PORT=1025
  #   SMTP_USE_TLS=false
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: rentalspouse_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Interface web (caixa de entrada)
      - "1025:1025" # Servidor SMTP

volumes:
  postgres_data:
