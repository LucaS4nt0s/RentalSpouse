version: "3.9"

services:
  db:
    image: postgres:15
    container_name: rentalspouse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentalspouse
      POSTGRES_PASSWORD: rentalspouse_pass
      POSTGRES_DB: rentalspouse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentalspouse -d rentalspouse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentalspouse_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rentalspouse:rentalspouse_pass@db:5432/rentalspouse_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
